<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AmigoPet</title>
  <link rel="stylesheet" href="/static/styles.css?v=v9-final"/>
</head>
<body>

<div id="app">

  <!-- HOME -->
  <section id="home">
    <h1>🐾 AmigoPet</h1>
    <p>Conectando você ao melhor cuidado para seu pet</p>
    <button onclick="showLogin()">Entrar</button>
    <button onclick="showRegister()">Criar Conta</button>
  </section>

  <!-- LOGIN -->
  <section id="login" class="hidden">
    <h2>Login</h2>
    <input id="loginEmail" placeholder="Email"/>
    <input id="loginPassword" type="password" placeholder="Senha"/>
    <button onclick="login()">Entrar</button>
    <button onclick="goHome()">Voltar</button>
  </section>

  <!-- REGISTER -->
  <section id="register" class="hidden">
    <h2>Criar Conta</h2>

    <input id="r_name" placeholder="Nome completo"/>
    <input id="r_email" placeholder="Email"/>
    <input id="r_pass" type="password" placeholder="Senha"/>
    <input id="r_phone" placeholder="Telefone"/>
    <input id="r_address" placeholder="Endereço"/>
    <input id="r_city" placeholder="Cidade"/>
    <input id="r_state" placeholder="Estado"/>

    <label>Foto:</label>
    <input type="file" id="r_photo" accept="image/*" capture="environment" onchange="previewImage(event)">
    <img id="preview" class="preview"/>

    <button onclick="register()">Cadastrar</button>
    <button onclick="goHome()">Voltar</button>
  </section>

  <!-- DASHBOARD -->
  <section id="dashboard" class="hidden">
    <h2>Bem-vindo</h2>
    <p id="userName"></p>

    <button onclick="showPet()">Cadastrar Pet</button>
    <button onclick="logout()">Sair</button>
  </section>

  <!-- PET -->
  <section id="pet" class="hidden">
    <h2>Cadastrar Pet</h2>

    <input id="p_name" placeholder="Nome do pet"/>
    <input id="p_breed" placeholder="Raça"/>
    <input id="p_size" placeholder="Porte"/>
    <input id="p_age" placeholder="Idade"/>

    <label>Foto do Pet:</label>
    <input type="file" id="p_photo" accept="image/*" capture="environment" onchange="previewPet(event)">
    <img id="previewPet" class="preview"/>

    <button onclick="createPet()">Salvar Pet</button>
    <button onclick="backDashboard()">Voltar</button>
  </section>

</div>

<script src="/static/app.js?v=v9-final"></script>
</body>
</html>
