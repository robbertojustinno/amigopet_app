<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AmigoPet</title>
  <link rel="stylesheet" href="/static/styles.css?v=v9.2"/>
</head>
<body>

<div id="app">

  <section id="home" class="view">
    <h1>🐾 AmigoPet</h1>
    <p>Conectando você ao melhor cuidado para seu pet</p>
    <button id="btnShowLogin" type="button">Entrar</button>
    <button id="btnShowRegister" type="button">Criar Conta</button>
  </section>

  <section id="login" class="view hidden">
    <h2>Login do Cliente</h2>
    <input id="loginEmail" type="email" placeholder="Email"/>
    <input id="loginPassword" type="password" placeholder="Senha"/>
    <button id="btnLogin" type="button">Entrar</button>
    <button id="btnLoginBack" type="button">Voltar</button>
  </section>

  <section id="register" class="view hidden">
    <h2>Criar Conta</h2>

    <input id="r_name" placeholder="Nome completo"/>
    <input id="r_email" type="email" placeholder="Email"/>
    <input id="r_pass" type="password" placeholder="Senha"/>
    <input id="r_phone" placeholder="Telefone"/>
    <input id="r_address" placeholder="Endereço"/>
    <input id="r_city" placeholder="Cidade"/>
    <input id="r_state" placeholder="Estado" value="RJ"/>

    <label for="r_photo">Foto do cliente</label>
    <input type="file" id="r_photo" accept="image/*" capture="environment"/>
    <img id="preview" class="preview" alt="Prévia da foto do cliente"/>

    <button id="btnRegister" type="button">Cadastrar</button>
    <button id="btnRegisterBack" type="button">Voltar</button>
  </section>

  <section id="dashboard" class="view hidden">
    <h2>Bem-vindo</h2>
    <p id="userName"></p>

    <button id="btnShowPet" type="button">Cadastrar Pet</button>
    <button id="btnLogout" type="button">Sair</button>
  </section>

  <section id="pet" class="view hidden">
    <h2>Cadastrar Pet</h2>

    <input id="p_name" placeholder="Nome do pet"/>
    <input id="p_breed" placeholder="Raça"/>
    <input id="p_size" placeholder="Porte"/>
    <input id="p_age" placeholder="Idade"/>

    <label for="p_photo">Foto do Pet</label>
    <input type="file" id="p_photo" accept="image/*" capture="environment"/>
    <img id="previewPet" class="preview" alt="Prévia da foto do pet"/>

    <button id="btnCreatePet" type="button">Salvar Pet</button>
    <button id="btnPetBack" type="button">Voltar</button>
  </section>

</div>

<div id="toast" class="toast hidden"></div>

<script src="/static/app.js?v=v9.2"></script>
</body>
</html>
