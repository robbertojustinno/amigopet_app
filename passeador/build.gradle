plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rovix.amigopet.passeador'
    compileSdk 35

    def baseUrl = (project.findProperty('AMIGOPET_BASE_URL') ?: 'https://amigopet-6td8.onrender.com').toString().replaceAll('/+$', '')

    defaultConfig {
        applicationId 'com.rovix.amigopet.passeador'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'APP_URL', "\"${baseUrl}/passeador\""
        buildConfigField 'String', 'API_BASE_URL', "\"${baseUrl}\""
        buildConfigField 'String', 'ALLOWED_WEBVIEW_HOSTS', '"accounts.google.com,ssl.gstatic.com,www.gstatic.com"'
    }

    buildFeatures {
        buildConfig true
    }
}


dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
